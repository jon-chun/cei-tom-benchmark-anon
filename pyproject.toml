[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cei-tom"
version = "1.0.0"
description = "Contextual Emotional Inference (CEI) Benchmark for Theory of Mind Evaluation in LLMs"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "Anonymous Authors" }
]
keywords = [
    "pragmatic-reasoning",
    "theory-of-mind",
    "cognitive-science",
    "language-models",
    "compositional-generalization",
    "social-cognition"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "pyyaml>=6.0",
    "click>=8.0.0",
    "rich>=13.0.0",
    "pydantic>=2.0.0",
    "scikit-learn>=1.3.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "scipy>=1.11.0",
]

[project.optional-dependencies]
llm = [
    "openai>=1.0.0",
    "anthropic>=0.18.0",
    "google-genai>=1.0.0",
]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
]
all = [
    "cei-tom[llm,dev]",
]

[project.scripts]
cei-pipeline = "pipeline.cli:main"

[project.urls]
Repository = "https://anonymous.4open.science/r/cei-tom"

[tool.hatch.build.targets.wheel]
packages = ["src/pipeline", "src/core", "src/venue"]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP"]
ignore = ["E501", "B008"]

[tool.ruff.lint.isort]
known-first-party = ["pipeline", "core", "venue"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
disallow_untyped_defs = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["pandas.*", "numpy.*", "yaml.*", "matplotlib.*", "seaborn.*", "scipy.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = ["-v", "--tb=short"]
markers = [
    "slow: marks tests as slow",
    "llm: marks tests requiring LLM API",
]
